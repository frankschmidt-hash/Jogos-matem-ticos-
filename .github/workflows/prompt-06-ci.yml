name: Prompt 06 CI

on:
  push:
    branches:
      - feat/prompt-06-multiplayer-core
  pull_request:
    branches:
      - main

jobs:
  validate-multiplayer-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Shared room infrastructure tests
        run: npm run test -w @jogos/server -- room-infrastructure.test.ts
      - name: Multiplayer consolidation tests
        run: npm run test -w @jogos/server -- multiplayer-consolidation.test.ts
      - name: Existing focused room tests
        run: npm run test -w @jogos/server -- crazy-race-room-manager.test.ts number-race-room-manager.test.ts football-room-manager.test.ts session-manager.test.ts
      - name: Build
        run: npm run build
