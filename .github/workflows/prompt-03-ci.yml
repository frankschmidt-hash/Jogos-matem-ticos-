name: Prompt 03 CI

on:
  push:
    branches:
      - feat/prompt-03-crazy-race
  pull_request:
    branches:
      - main

jobs:
  validate-crazy-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Crazy race focused tests
        run: npm run test -w @jogos/crazy-race
      - name: Realtime room focused tests
        run: npm run test -w @jogos/server -- crazy-race-room-manager.test.ts
      - name: Math engine compatibility tests
        run: npm run test -w @jogos/math-engine
      - name: Build
        run: npm run build
