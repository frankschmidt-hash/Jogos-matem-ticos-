name: Prompt 05 CI

on:
  push:
    branches:
      - feat/prompt-05-math-football
  pull_request:
    branches:
      - main

jobs:
  validate-math-football:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Football focused tests
        run: npm run test -w @jogos/math-football
      - name: Football realtime room tests
        run: npm run test -w @jogos/server -- football-room-manager.test.ts
      - name: Math engine compatibility tests
        run: npm run test -w @jogos/math-engine
      - name: Build
        run: npm run build
